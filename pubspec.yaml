name: runzone
description: "A heart-rate zone based running coach built with Flutter."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  bloc: ^9.2.1
  cupertino_icons: ^1.0.8
  equatable: ^2.0.8
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  widgetbook: ^3.8.1
  shared_preferences: ^2.5.5
  widgetbook_annotation: ^3.11.0
  flutter_svg: ^2.3.0
  go_router: ^17.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  widgetbook_generator: ^3.24.0
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#E8FF3A"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png

flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#F3F5F7"
  image: assets/branding/splash_content_light.png
  color_dark: "#050608"
  image_dark: assets/branding/splash_content_dark.png
  android_12:
    color: "#F3F5F7"
    image: assets/branding/splash_content_light.png
    color_dark: "#050608"
    image_dark: assets/branding/splash_content_dark.png

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/icons/

  fonts:
    - family: IBM Plex Sans KR
      fonts:
        - asset: assets/fonts/IBMPlexSansKR-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansKR-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansKR-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansKR-Bold.ttf
          weight: 700
